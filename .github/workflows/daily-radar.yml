name: Daily Stock Radar

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC = 15:30 JST. This is after Japan's normal cash session and before the US session.
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required files
        run: |
          test -f config.json
          python -m json.tool config.json > /dev/null

      - name: Run tests
        run: pytest -q

      - name: Build daily radar
        run: python radar.py

      - name: Evaluate matured predictions
        run: python evaluate.py

      - name: Create improvement review
        run: python improve.py

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Daily radar update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
