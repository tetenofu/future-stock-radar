name: Daily Future Stock Radar v4.2

on:
  schedule:
    # 07:17 JST = 22:17 UTC (previous day)
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: future-stock-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate radar files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [Path("radar.py"), Path("config.json"), Path("requirements.txt")]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          print("Required files OK")
          PY

      - name: Run radar
        run: python radar.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-stock-radar-diagnostics-v4.2
          path: data/
          if-no-files-found: ignore

      - name: Save results
        if: success()
        run: |
          git config user.name "future-stock-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Update daily radar"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
